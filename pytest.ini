[pytest]
# Test discovery for the Complex Mathematics Tutor Agent.
#
#   cd complex_math_tutor && python -m pytest -v
#
# Every test runs against the offline deterministic provider (or a scripted
# fake provider), so no API key and no network access are required.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# tests/ must be importable so `from fakes import FakeProvider` works.
# ".." puts the project root on sys.path so that `import complex_math_tutor`
# resolves to the package directory (this folder) when pytest is started here.
pythonpath = . tests ..

addopts = -ra --strict-markers
filterwarnings =
    error::DeprecationWarning:complex_math_tutor.*
